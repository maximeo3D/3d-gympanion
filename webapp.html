<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#d0d0d0">
    <title>Personnaliser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
    <style>
        :root {
            --bg: #d0d0d0;
            --panel: #ffffff;
            --ink: #161616;
            --muted: #6b6b6b;
            --accent: #111111;
            --radius: 22px;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--bg);
            font-family: Inter, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .viewer-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            width: 100dvw;
            height: 100dvh;
            border: 0;
            margin: 0;
            padding: 0;
            display: block;
            background: var(--bg);
            z-index: 0;
        }

        .ui-root {
            position: fixed;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        .ui-dock {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: min(460px, 100%);
            padding: 12px 16px calc(18px + env(safe-area-inset-bottom));
            box-sizing: border-box;
            pointer-events: auto;
        }

        .ui-card {
            background: var(--panel);
            border-radius: var(--radius);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 16px;
        }

        .screen {
            display: none;
        }

        .screen.is-active {
            display: block;
        }

        .home-row {
            display: grid;
            grid-template-columns: 1fr 54px;
            gap: 8px;
        }

        .cta {
            width: 100%;
            height: 54px;
            border: 0;
            border-radius: 16px;
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .cta:active,
        .cta-shot:active {
            transform: scale(0.985);
        }

        .cta svg,
        .cta-shot svg {
            width: 18px;
            height: 18px;
        }

        .cta-shot {
            width: 54px;
            height: 54px;
            border: 0;
            border-radius: 16px;
            background: #f4f4f4;
            color: var(--ink);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .cta-shot.is-busy {
            opacity: 0.45;
            cursor: default;
        }

        .shutter {
            position: fixed;
            inset: 0;
            background: #fff;
            pointer-events: none;
            z-index: 40;
            opacity: 0;
        }

        .shutter.is-on {
            animation: shutter-flash 0.35s ease;
        }

        @keyframes shutter-flash {
            0% { opacity: 0.72; }
            100% { opacity: 0; }
        }

        .engraving-field {
            margin: 0 0 16px;
        }

        .engraving-input {
            width: 100%;
            height: 56px;
            box-sizing: border-box;
            border: 1px solid #ececec;
            border-radius: 14px;
            background: #f7f7f7;
            text-align: center;
            font-family: inherit;
            font-size: 22px;
            font-weight: 650;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--ink);
            outline: none;
        }

        .engraving-input:focus {
            border-color: #cfcfcf;
            background: #fff;
        }

        .engraving-count {
            margin: 8px 0 0;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        .step-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .step-kicker {
            margin: 0;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .step-title {
            margin: 4px 0 0;
            font-size: 20px;
            font-weight: 650;
            letter-spacing: -0.03em;
            color: var(--ink);
        }

        .step-choice {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
            text-align: right;
            max-width: 55%;
        }

        .swatches {
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            gap: 6px;
            margin: 0 0 16px;
        }

        .swatch {
            flex: 1 1 0;
            min-width: 0;
            width: auto;
            height: 40px;
            border: 0;
            padding: 0;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swatch-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            box-sizing: border-box;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 0 0 2px transparent, 0 0 0 4px transparent;
            transition: box-shadow 0.18s ease, transform 0.18s ease;
        }

        .swatch-dot.is-light {
            border-color: rgba(0, 0, 0, 0.18);
        }

        .swatch.is-selected .swatch-dot {
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent);
        }

        .nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .nav-btn {
            height: 46px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-btn.prev {
            background: #f4f4f4;
            border: 0;
            color: var(--ink);
        }

        .nav-btn.next {
            background: var(--accent);
            border: 0;
            color: #fff;
        }

        .nav-btn:disabled,
        .cta:disabled,
        .cta-shot:disabled {
            opacity: 0.45;
            cursor: default;
        }
    </style>
</head>
<body>
    <iframe
        id="viewer-frame"
        class="viewer-frame"
        src="index.html"
        title="Visualisation 3D"
        allowfullscreen
    ></iframe>

    <div class="shutter" id="shutter" aria-hidden="true"></div>

    <div class="ui-root">
        <div class="ui-dock" id="ui-dock">
            <div class="ui-card">
                <div class="screen is-active" id="screen-home" data-screen="home" aria-hidden="false">
                    <div class="home-row">
                        <button class="cta" id="btn-customize" type="button" disabled>
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                                <path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6M17.9 17.9l-1.6-1.6M7.7 7.7 6.1 6.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            </svg>
                            Personnaliser
                        </button>
                        <button class="cta-shot" id="btn-shot" type="button" disabled aria-label="Photographier">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M8.2 7.2 9 5.8A1.4 1.4 0 0 1 10.2 5h3.6A1.4 1.4 0 0 1 15 5.8l.8 1.4H18a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.2Z" stroke="currentColor" stroke-width="1.8"/>
                                <circle cx="12" cy="13" r="3.1" stroke="currentColor" stroke-width="1.8"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="screen" id="screen-step" data-screen="step" aria-hidden="true">
                    <div class="step-head">
                        <div>
                            <p class="step-kicker" id="step-kicker">Étape 1 / 3</p>
                            <h2 class="step-title" id="step-title">Boîtier</h2>
                        </div>
                        <p class="step-choice" id="step-choice"></p>
                    </div>
                    <div class="swatches" id="swatches" role="listbox" aria-label="Couleurs"></div>
                    <div class="nav">
                        <button class="nav-btn prev" id="btn-prev" type="button">Précédent</button>
                        <button class="nav-btn next" id="btn-next" type="button">Suivant</button>
                    </div>
                </div>

                <div class="screen" id="screen-engraving" data-screen="engraving" aria-hidden="true">
                    <div class="step-head">
                        <div>
                            <p class="step-kicker" id="engraving-kicker">Étape 3 / 3</p>
                            <h2 class="step-title" id="engraving-title">Gravure</h2>
                        </div>
                    </div>
                    <div class="engraving-field">
                        <input
                            id="engraving-input"
                            class="engraving-input"
                            type="text"
                            maxlength="3"
                            autocomplete="off"
                            autocapitalize="characters"
                            spellcheck="false"
                            placeholder="ABC"
                            aria-label="Texte de gravure, 3 caractères maximum"
                        >
                        <p class="engraving-count" id="engraving-count">0 / 3</p>
                    </div>
                    <div class="nav">
                        <button class="nav-btn prev" id="btn-engraving-prev" type="button">Précédent</button>
                        <button class="nav-btn next" id="btn-engraving-next" type="button">Suivant</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const TITLE_MAP = {
                case: 'Boîtier',
                button: 'Bouton'
            };

            const LABEL_MAP = {
                aluminium: 'Aluminium',
                'aluminium red': 'Aluminium rouge',
                'aluminium black': 'Aluminium noir',
                'plastic black': 'Plastique noir',
                'plastic red': 'Plastique rouge',
                'plastic light blue': 'Plastique bleu clair',
                'plastic lavender': 'Plastique lavande',
                'plastic metallic grey': 'Plastique gris métal',
                'plastic white': 'Plastique blanc'
            };

            const SWATCH_MAP = {
                aluminium: 'linear-gradient(135deg, #f6f6f6 0%, #c8c8c8 40%, #fafafa 68%, #9b9b9b 100%)',
                'aluminium red': 'linear-gradient(135deg, #b41414 0%, #850606 48%, #5a0404 100%)',
                'aluminium black': 'linear-gradient(135deg, #3a3a3a 0%, #0e0e0e 55%, #1c1c1c 100%)',
                'plastic black': '#111111',
                'plastic red': '#f00000',
                'plastic light blue': '#7aceff',
                'plastic lavender': '#e5b7ff',
                'plastic metallic grey': 'linear-gradient(135deg, #8d8d8d 0%, #5b5b5b 50%, #3e3e3e 100%)',
                'plastic white': '#ffffff'
            };

            const iframe = document.getElementById('viewer-frame');
            const ui = {
                home: document.getElementById('screen-home'),
                step: document.getElementById('screen-step'),
                engraving: document.getElementById('screen-engraving'),
                customize: document.getElementById('btn-customize'),
                shot: document.getElementById('btn-shot'),
                shutter: document.getElementById('shutter'),
                dock: document.getElementById('ui-dock'),
                kicker: document.getElementById('step-kicker'),
                title: document.getElementById('step-title'),
                choice: document.getElementById('step-choice'),
                swatches: document.getElementById('swatches'),
                prev: document.getElementById('btn-prev'),
                next: document.getElementById('btn-next'),
                engravingKicker: document.getElementById('engraving-kicker'),
                engravingInput: document.getElementById('engraving-input'),
                engravingCount: document.getElementById('engraving-count'),
                engravingPrev: document.getElementById('btn-engraving-prev'),
                engravingNext: document.getElementById('btn-engraving-next')
            };

            const state = {
                ready: false,
                api: null,
                rules: [],
                engraving: null,
                engravingText: '',
                stepIndex: -1,
                selected: {},
                viewpoints: {
                    home: 'viewpoint_case',
                    case: 'viewpoint_case',
                    button: 'viewpoint_button',
                    engraving: 'viewpoint_engraving'
                }
            };

            function viewerWindow() {
                return iframe.contentWindow || null;
            }

            function viewerApi() {
                const win = viewerWindow();
                return win && win.viewer;
            }

            function keyOf(value) {
                return String(value || '').toLowerCase().trim();
            }

            function isBaseRule(rule) {
                return keyOf(rule.label) === 'base' || keyOf(rule.id) === 'base';
            }

            function displayTitle(rule) {
                return TITLE_MAP[keyOf(rule.label)] || TITLE_MAP[keyOf(rule.id)] || rule.label;
            }

            function displayLabel(option) {
                return LABEL_MAP[keyOf(option.label)] || option.label;
            }

            function swatchBackground(option) {
                return SWATCH_MAP[keyOf(option.label)] || '#888888';
            }

            function isLightSwatch(option) {
                const key = keyOf(option.label);
                return key === 'aluminium' || key.includes('white') || key.includes('light blue');
            }

            function viewpointFor(rule) {
                if (!rule) return state.viewpoints.home;
                if (keyOf(rule.label) === 'button') return state.viewpoints.button;
                if (keyOf(rule.label) === 'engraving' || keyOf(rule.label) === 'gravure') {
                    return state.viewpoints.engraving;
                }
                return state.viewpoints.case;
            }

            function totalSteps() {
                return state.rules.length + (state.engraving ? 1 : 0);
            }

            function isEngravingStep(index) {
                return !!state.engraving && index === state.rules.length;
            }

            function gotoViewpoint(id) {
                const viewer = viewerApi();
                if (!state.ready || !id || !viewer) return;
                viewer.gotoViewpoint(id);
            }

            function applyRule(ruleId, optionId) {
                const viewer = viewerApi();
                if (!state.ready || !viewer) return;
                viewer.applyRule(ruleId, optionId);
            }

            function applyHiddenRules() {
                const hidden = ((state.api && state.api.project && state.api.project.rules) || [])
                    .filter(isBaseRule);
                hidden.forEach(function (rule) {
                    const option = rule.options && rule.options[0];
                    if (option) applyRule(rule.id, option.id);
                });
            }

            function fillViewerDocument() {
                const doc = iframe.contentDocument;
                if (!doc || !doc.head || doc.getElementById('webapp-fill')) return;
                const style = doc.createElement('style');
                style.id = 'webapp-fill';
                style.textContent = 'html,body,.container,.canvas-container,#renderCanvas{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;}';
                doc.head.appendChild(style);
            }

            function sharpenViewer() {
                const win = viewerWindow();
                if (!win) return;
                fillViewerDocument();
                try {
                    const Engine = win.BABYLON && win.BABYLON.Engine;
                    const Store = win.BABYLON && win.BABYLON.EngineStore;
                    const engine = (Store && Store.LastCreatedEngine) || (Engine && Engine.LastCreatedEngine);
                    if (engine) {
                        const dpr = win.devicePixelRatio || window.devicePixelRatio || 1;
                        engine.setHardwareScalingLevel(1 / dpr);
                        engine.resize(true);
                    }
                } catch (_) {}
                try {
                    win.dispatchEvent(new Event('resize'));
                } catch (_) {}
            }

            function fitIframeToScreen() {
                const vv = window.visualViewport;
                const width = Math.round((vv && vv.width) || window.innerWidth);
                const height = Math.round((vv && vv.height) || window.innerHeight);
                iframe.style.width = width + 'px';
                iframe.style.height = height + 'px';
                if (vv && ui.dock) {
                    ui.dock.style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px';
                }
                sharpenViewer();
            }

            function showScreen(name) {
                ui.home.classList.toggle('is-active', name === 'home');
                ui.step.classList.toggle('is-active', name === 'step');
                ui.engraving.classList.toggle('is-active', name === 'engraving');
                ui.home.setAttribute('aria-hidden', name === 'home' ? 'false' : 'true');
                ui.step.setAttribute('aria-hidden', name === 'step' ? 'false' : 'true');
                ui.engraving.setAttribute('aria-hidden', name === 'engraving' ? 'false' : 'true');
            }

            function currentRule() {
                return state.rules[state.stepIndex] || null;
            }

            function renderStep() {
                const rule = currentRule();
                if (!rule) {
                    showScreen('home');
                    gotoViewpoint(viewpointFor(null));
                    return;
                }

                showScreen('step');
                ui.kicker.textContent = 'Étape ' + (state.stepIndex + 1) + ' / ' + totalSteps();
                ui.title.textContent = displayTitle(rule);

                const selectedId = state.selected[rule.id];
                const selected = (rule.options || []).find(function (option) {
                    return option.id === selectedId;
                });
                ui.choice.textContent = selected ? displayLabel(selected) : '';

                ui.swatches.innerHTML = '';
                (rule.options || []).forEach(function (option) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'swatch' + (option.id === selectedId ? ' is-selected' : '');
                    button.setAttribute('role', 'option');
                    button.setAttribute('aria-selected', option.id === selectedId ? 'true' : 'false');
                    button.setAttribute('aria-label', displayLabel(option));
                    button.title = displayLabel(option);

                    const dot = document.createElement('span');
                    dot.className = 'swatch-dot' + (isLightSwatch(option) ? ' is-light' : '');
                    dot.style.background = swatchBackground(option);

                    button.appendChild(dot);
                    button.addEventListener('click', function () {
                        state.selected[rule.id] = option.id;
                        applyRule(rule.id, option.id);
                        renderStep();
                    });
                    ui.swatches.appendChild(button);
                });
            }

            function normalizeEngraving(value) {
                return String(value || '').replace(/\s+/g, '').slice(0, 3).toUpperCase();
            }

            function applyEngravingText(value) {
                state.engravingText = normalizeEngraving(value);
                ui.engravingInput.value = state.engravingText;
                ui.engravingCount.textContent = state.engravingText.length + ' / 3';
                const viewer = viewerApi();
                if (!state.ready || !viewer || !state.engraving) return;
                viewer.setEngravingText(state.engraving.id, state.engravingText);
            }

            function applyEngravingFont() {
                const viewer = viewerApi();
                if (!state.ready || !viewer || !state.engraving) return;
                const font = (state.engraving.fonts && state.engraving.fonts[0]) || state.engraving.font;
                if (font && viewer.setEngravingFont) viewer.setEngravingFont(state.engraving.id, font);
            }

            function renderEngraving() {
                showScreen('engraving');
                ui.engravingKicker.textContent = 'Étape ' + totalSteps() + ' / ' + totalSteps();
                ui.engravingInput.value = state.engravingText;
                ui.engravingCount.textContent = state.engravingText.length + ' / 3';
                gotoViewpoint(state.viewpoints.engraving);
                setTimeout(function () {
                    ui.engravingInput.focus();
                }, 180);
            }

            function goHome() {
                state.stepIndex = -1;
                showScreen('home');
                gotoViewpoint(viewpointFor(null));
            }

            function goToStep(index) {
                if (index < 0 || index >= totalSteps()) {
                    goHome();
                    return;
                }
                state.stepIndex = index;
                if (isEngravingStep(index)) {
                    renderEngraving();
                    return;
                }
                renderStep();
                gotoViewpoint(viewpointFor(currentRule()));
            }

            function downloadDataUrl(dataUrl, filename) {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
            }

            function flashShutter() {
                ui.shutter.classList.remove('is-on');
                void ui.shutter.offsetWidth;
                ui.shutter.classList.add('is-on');
                setTimeout(function () {
                    ui.shutter.classList.remove('is-on');
                }, 360);
            }

            async function takeShot() {
                const viewer = viewerApi();
                if (!state.ready || !viewer || ui.shot.disabled || ui.shot.classList.contains('is-busy')) return;
                ui.shot.classList.add('is-busy');
                ui.shot.disabled = true;
                try {
                    flashShutter();
                    const dataUrl = await viewer.shooting();
                    if (dataUrl) downloadDataUrl(dataUrl, 'gympanion.png');
                } catch (error) {
                    console.error('Shooting failed:', error);
                } finally {
                    ui.shot.classList.remove('is-busy');
                    ui.shot.disabled = false;
                }
            }

            function initFromApi(api) {
                state.api = api;
                const project = (api && api.project) || {};
                const viewpoints = project.viewpoints || [];

                const caseVp = viewpoints.find(function (item) {
                    return /case/i.test(item.id) || /case/i.test(item.label);
                });
                const buttonVp = viewpoints.find(function (item) {
                    return /button/i.test(item.id) || /button/i.test(item.label);
                });
                const engravingVp = viewpoints.find(function (item) {
                    return /engrav/i.test(item.id) || /engrav/i.test(item.label) || /gravure/i.test(item.id);
                });

                state.viewpoints.home = project.defaultViewpoint || (caseVp && caseVp.id) || 'viewpoint_case';
                state.viewpoints.case = (caseVp && caseVp.id) || state.viewpoints.home;
                state.viewpoints.button = (buttonVp && buttonVp.id) || 'viewpoint_button';
                state.viewpoints.engraving = (engravingVp && engravingVp.id) || 'viewpoint_engraving';

                state.rules = (project.rules || []).filter(function (rule) {
                    return !isBaseRule(rule);
                });

                const defaultRules = (project.defaults && project.defaults.rules) || {};
                state.rules.forEach(function (rule) {
                    state.selected[rule.id] = defaultRules[rule.id]
                        || (rule.options && rule.options[0] && rule.options[0].id)
                        || state.selected[rule.id];
                });

                state.engraving = (project.engravings && project.engravings[0]) || null;
                state.engravingText = normalizeEngraving((project.defaults && project.defaults.engravingText) || '');
            }

            function startWhenReady() {
                if (!state.ready || !state.api) return;
                ui.customize.disabled = false;
                ui.shot.disabled = false;
                applyHiddenRules();
                applyEngravingFont();
                applyEngravingText(state.engravingText);
                fitIframeToScreen();
                gotoViewpoint(viewpointFor(currentRule()));
            }

            function onViewerReady() {
                if (state.ready) return;
                state.ready = true;
                startWhenReady();
            }

            function bindViewer() {
                const win = viewerWindow();
                if (!win) return;
                if (win.viewerReady) onViewerReady();
                win.addEventListener('viewer-api-ready', onViewerReady);
                fitIframeToScreen();
            }

            ui.customize.addEventListener('click', function () {
                goToStep(0);
            });

            ui.shot.addEventListener('click', function () {
                takeShot();
            });

            ui.prev.addEventListener('click', function () {
                goToStep(state.stepIndex - 1);
            });

            ui.next.addEventListener('click', function () {
                goToStep(state.stepIndex + 1);
            });

            ui.engravingPrev.addEventListener('click', function () {
                goToStep(state.stepIndex - 1);
            });

            ui.engravingNext.addEventListener('click', function () {
                goToStep(state.stepIndex + 1);
            });

            ui.engravingInput.addEventListener('input', function () {
                applyEngravingText(ui.engravingInput.value);
            });

            iframe.addEventListener('load', bindViewer);
            window.addEventListener('resize', fitIframeToScreen);
            window.addEventListener('orientationchange', function () {
                setTimeout(fitIframeToScreen, 80);
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', fitIframeToScreen);
            }

            fetch('api.json')
                .then(function (response) {
                    if (!response.ok) throw new Error('api.json introuvable');
                    return response.json();
                })
                .then(function (api) {
                    initFromApi(api);
                    startWhenReady();
                })
                .catch(function () {
                    initFromApi({
                        project: {
                            rules: [],
                            viewpoints: [
                                { id: 'viewpoint_case', label: 'viewpoint_case' },
                                { id: 'viewpoint_button', label: 'viewpoint_button' },
                                { id: 'viewpoint_engraving', label: 'viewpoint_engraving' }
                            ],
                            engravings: [{ id: 'gravure', label: 'Gravure', fonts: ['Odin Rounded - Bold'] }],
                            defaultViewpoint: 'viewpoint_case'
                        }
                    });
                    startWhenReady();
                });
        })();
    </script>
</body>
</html>
